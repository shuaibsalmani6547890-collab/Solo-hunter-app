name: make-icons
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Make PNG icons
        run: |
          rsvg-convert -w 192 -h 192 icon.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png
      - name: Save icons
        run: |
          git config user.name "icon-bot"
          git config user.email "icon-bot@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git commit -m "add icons" || echo "no change"
          git push
